<!DOCTYPE html>
<html>
<head>
    <title>Task Manager</title>
</head>
<body>
    <h1 id="header">Item List</h1>
    <ul id="item-list">
        {% for item in items %}
            <li>{{ item[1] }}</li>
        {% endfor %}
    </ul>
    <form action="/add" method="POST">
        <input type="text" name="name" id="item-name" placeholder="Enter item name" required>
        <button type="submit" id="add-btn">Add Item</button>
    </form>
</body>
</html>
